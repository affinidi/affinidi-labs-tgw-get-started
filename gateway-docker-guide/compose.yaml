# Affinidi Agent Gateway — Docker Compose
#
# The image below sets the gateway version. To upgrade, use the compose.yaml of the new
# release, or set AG_IMAGE in .env. Nothing else in this file names a version.
#
# Start:  docker compose up -d
# Works on macOS, Linux, and Windows (Docker Desktop). Image: linux/amd64 and linux/arm64.
#
# On the first start, the "init" step creates these folders next to this file:
#   config/          configuration (generated by the image + default files from GitHub)
#   certs/           temporary self-signed TLS certificate
#   secrets/         secret keys (keys.env)
#   storage/         gateway data
#   backup_restore/  backups made from the dashboard
# Later starts never overwrite these files.
#
# Optional settings (copy .env.example to .env next to this file, see that file for all settings):
#   PUBLIC_URL=https://gateway.example.com   address used by browsers and agents (default: http://localhost:8080)
#   AG_PUBLISH_ADDRESS=0.0.0.0               open the ports to the network (default: 127.0.0.1, this computer only)
#                                            Network setting only. Docker needs an IP address here, not a name.
#
# IMPORTANT: open the dashboard with the PUBLIC_URL address, for example http://localhost:8080/dashboard/
# Do NOT use http://127.0.0.1:8080. Browsers do not allow passkeys (WebAuthn) on an IP address.
#   AG_HTTP_PORT=8080                        host port for HTTP
#   AG_HTTPS_PORT=8443                       host port for HTTPS

x-image: &image ${AG_IMAGE:-public.ecr.aws/affinidi/agent-gateway:v1.0.10@sha256:1806f329f765e680d7c745fc95a4629f1d1964af5cfe468dcfcf150140dd3046}

services:
  init:
    image: *image
    user: "0"
    restart: "no"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${AG_HTTP_PORT:-8080}}
    volumes:
      - .:/work
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /work
        mkdir -p config certs secrets storage backup_restore
        URL="$${PUBLIC_URL%/}"
        HOST="$$(echo "$$URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$$##')"
        AG_VERSION="$$(/usr/local/bin/agent-gateway --version | awk '{print $$2}')"
        echo "Agent Gateway version $$AG_VERSION"

        if [ ! -f secrets/keys.env ]; then
          echo "Creating secret keys in secrets/keys.env"
          for k in AG_MASTER_KEY AG_BACKUP_ENCRYPTION_KEY AG_IDENTITY_HASH_PEPPER; do
            echo "$$k=$$(openssl rand -hex 32)"
          done > secrets/keys.env
        fi

        if [ ! -f config/config.toml ]; then
          echo "Creating configuration for $$URL"
          /usr/local/bin/agent-gateway --generate-bootstrap --base-folder /app --cors-origins "$$URL" > /tmp/config.toml
          sed -i '/^\[encryption\]/,/^\[/ s/^enabled = false/enabled = true/' /tmp/config.toml

          if [ -f "agent-gateway-$$AG_VERSION.tar.gz" ]; then
            echo "Using local file agent-gateway-$$AG_VERSION.tar.gz"
            cp "agent-gateway-$$AG_VERSION.tar.gz" /tmp/source.tar.gz
          else
            SRC="https://github.com/affinidi-ai/agent-gateway/archive/refs/tags/v$$AG_VERSION.tar.gz"
            echo "Downloading default configuration files from $$SRC"
            curl -fsSL "$$SRC" -o /tmp/source.tar.gz
          fi
          tar -xzf /tmp/source.tar.gz -C /tmp
          EX="/tmp/agent-gateway-$$AG_VERSION/config/examples"
          for f in "$$EX"/*.example.json; do
            n="$$(basename "$$f" .example.json)"
            cp "$$f" "config/$$n.json"
          done
          cp -R "$$EX/agent_surface_templates" config/
          sed -i \
            -e "s|\"external_origin\": \"https://YOUR_DOMAIN\"|\"external_origin\": \"$$URL\"|" \
            -e "s|\"https://YOUR_DOMAIN\",|\"$$URL\",|" \
            -e "s|\"https://YOUR_OUTBOUND_DOMAIN\",|\"http://agent-gateway:9000\",|" \
            -e "s|YOUR_DOMAIN|$$HOST|g" \
            config/gateway.json
          mv /tmp/config.toml config/config.toml
        fi

        if [ ! -f certs/cert.pem ] || [ ! -f certs/key.pem ]; then
          echo "Creating a temporary self-signed certificate for $$HOST"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 90 \
            -subj "/CN=$$HOST" -addext "subjectAltName=DNS:$$HOST" \
            -keyout certs/key.pem -out certs/cert.pem 2>/dev/null
        fi

        # Config files belong to the folder owner, so you can edit them without sudo.
        OWNER="$$(stat -c %u:%g /work)"
        chown -R "$$OWNER" config certs/cert.pem 2>/dev/null || true
        # Data, keys, and the private key belong to the container user (999).
        chown -R 999:999 storage backup_restore secrets certs/key.pem 2>/dev/null || true
        chmod 600 secrets/keys.env certs/key.pem 2>/dev/null || true
        echo "Ready. Open $$URL/dashboard/ in your browser."
        echo "Use exactly this address. Passkeys do not work with 127.0.0.1 or another name."

  agent-gateway:
    image: *image
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/bin/sh", "-c", "set -a && . /app/secrets/keys.env && set +a && exec /usr/local/bin/agent-gateway --config /app/config/config.toml"]
    ports:
      # 127.0.0.1 = listen only on this computer (network setting). In the browser, use localhost.
      - "${AG_PUBLISH_ADDRESS:-127.0.0.1}:${AG_HTTP_PORT:-8080}:8080"
      - "${AG_PUBLISH_ADDRESS:-127.0.0.1}:${AG_HTTPS_PORT:-8443}:8443"
      # Port 9000 (outbound for your agents) is not published. Agents in this Docker network use http://agent-gateway:9000.
    volumes:
      - ./config:/app/config:ro
      - ./certs:/app/certs:ro
      - ./secrets:/app/secrets:ro
      - ./storage:/app/_storage
      - ./backup_restore:/app/_backup_restore
    # The check runs inside the container, which always listens on 8080.
    # AG_HTTP_PORT changes only the port on your computer, so do not change this URL.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
