# Agent Gateway → Prometheus → Grafana
# Pull-based integration. Prometheus scrapes the Agent Gateway's native
# /api/v1/metrics/prometheus endpoint and Grafana visualises the metrics.
#
# Usage:
#   docker compose up -d
#   open http://localhost:3000   (admin / admin)

name: tgw-prometheus-integration

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tgw-prom
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: tgw-prom-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
